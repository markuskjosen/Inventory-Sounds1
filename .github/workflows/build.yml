name: Build Inventory Sounds

on:
  workflow_dispatch:
  push:
    branches: [inventory-sounds-only]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Generate standalone project from supplied source JAR
        run: python3 scripts/generate_project.py
      - name: Build Fabric mod
        run: gradle build --stacktrace
      - name: Upload finished mod
        uses: actions/upload-artifact@v4
        with:
          name: inventory-sounds-26.2
          path: build/libs/inventory-sounds-26.2-1.0.0.jar
          if-no-files-found: error
